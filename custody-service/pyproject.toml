[project]
name = "pulpo-hostile-worker-custody"
version = "0.1.0"
description = "Narrow custody/execution boundary for Pulpo Hostile Worker Consequence Proof V0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
]

[project.optional-dependencies]
test = [
  "httpx2==2.12.0",
  # Starlette 1.6.0 still imports anyio.abc.BlockingPortal. AnyIO 4.15.0
  # deprecated that alias, which becomes a hard failure under `python -W error`.
  # Pin the last reviewed compatible line so CI cannot drift underneath an
  # unchanged custody proof.
  "anyio==4.14.2",
]

[tool.setuptools.packages.find]
where = ["src"]
