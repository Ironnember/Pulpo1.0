[project]
name = "pulpo"
version = "0.1.0"
description = "A minimal governed-execution kernel for agentic systems"
requires-python = ">=3.11"

[project.optional-dependencies]
authority = ["cryptography==50.0.1"]
mcp = ["mcp[cli]>=2,<3"]
web = ["Flask>=3.0,<4"]

[project.scripts]
pulpo-git-clarity = "pulpo.git_clarity:main"

[tool.setuptools]
packages = ["pulpo", "mobile_demo"]
