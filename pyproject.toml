[project]
name = "pulpo"
version = "0.1.0"
description = "A minimal governed-execution kernel for agentic systems"
requires-python = ">=3.11"

[project.scripts]
pulpo-speak = "pulpo.local_speech:main"
pulpo-listen = "pulpo.local_listen:main"
pulpo-voice-demo = "pulpo.voice_demo:main"
pulpo-effect-demo = "pulpo.local_effect_demo:main"
pulpo-lab = "pulpo.local_lab:main"

[project.optional-dependencies]
authority = ["cryptography==50.0.1"]
web = ["Flask>=3.0,<4"]
web-production = ["gunicorn>=23,<24"]
voice = [
  "sounddevice>=0.5,<1",
  "faster-whisper>=1.1,<2",
]

[tool.setuptools]
packages = ["pulpo", "mobile_demo"]
