name: CI

on:
  push:
    branches:
      - main
      - experiment/cross-model-pulpo-lift-2026-08-27
  pull_request:

permissions:
  contents: read
  copilot-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run zero-dependency tests
        run: python -W error -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q pulpo tests
      - name: Check committed whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reviewed authority verifier dependency
        run: python -m pip install '.[authority]'
      - name: Run asymmetric authority contract tests
        run: python -W error -m unittest tests.test_authority_crypto -v

  authority-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent authority proof packages
        run: python -m pip install '.[authority]' './authority-service[test]'
      - name: Run independent authority service proof
        run: PYTHONPATH=authority-service/src:. python -W error -m unittest discover -s authority-service/tests -v
      - name: Compile independent service sources
        run: python -m compileall -q authority-service/src authority-service/tests

  cross-model-benchmark:
    if: >-
      (github.event_name == 'pull_request' && github.head_ref == 'experiment/cross-model-pulpo-lift-2026-08-27') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/experiment/cross-model-pulpo-lift-2026-08-27')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Copilot CLI
        run: npm install -g '@github/copilot@1.0.80'
      - name: Run frozen model-only versus model-plus-Pulpo benchmark
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python experiments/cross-model-pulpo-lift/run.py
      - name: Publish benchmark summary
        if: always()
        run: |
          if [ -f experiments/cross-model-pulpo-lift/SUMMARY.md ]; then
            cat experiments/cross-model-pulpo-lift/SUMMARY.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-model-pulpo-lift-${{ github.sha }}
          path: |
            experiments/cross-model-pulpo-lift/results.json
            experiments/cross-model-pulpo-lift/SUMMARY.md
          if-no-files-found: warn
          retention-days: 30
