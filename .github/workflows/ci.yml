name: CI

on:
  push:
    branches:
      - main
      - experiment/cross-model-pulpo-lift-2026-08-27
      - experiment/cross-model-pulpo-lift-b-2026-08-27
      - diagnostic/copilot-actions-model-policy-2026-08-27
  pull_request:

permissions:
  contents: read
  copilot-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run zero-dependency tests
        run: python -W error -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q pulpo tests
      - name: Check committed whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reviewed authority verifier dependency
        run: python -m pip install '.[authority]'
      - name: Run asymmetric authority contract tests
        run: python -W error -m unittest tests.test_authority_crypto -v

  authority-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent authority proof packages
        run: python -m pip install '.[authority]' './authority-service[test]'
      - name: Run independent authority service proof
        run: PYTHONPATH=authority-service/src:. python -W error -m unittest discover -s authority-service/tests -v
      - name: Compile independent service sources
        run: python -m compileall -q authority-service/src authority-service/tests

  copilot-auto-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/copilot-actions-model-policy-2026-08-27'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Copilot CLI
        run: npm install -g '@github/copilot@1.0.80'
      - name: Probe auto-selected model with no tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-auto-probe
        run: |
          mkdir -p "$COPILOT_HOME"
          mkdir -p "${{ runner.temp }}/empty-probe"
          cd "${{ runner.temp }}/empty-probe"
          copilot -p 'Return exactly READY and nothing else.' \
            --model auto \
            --max-ai-credits=30 \
            --excluded-tools='bash,powershell,list_bash,list_powershell,read_bash,read_powershell,stop_bash,stop_powershell,write_bash,write_powershell,apply_patch,create,edit,view,list_agents,read_agent,task,write_agent,ask_user,glob,grep,rg,skill,web_fetch' \
            --disable-builtin-mcps \
            --no-custom-instructions \
            --no-ask-user \
            --no-auto-update \
            --no-bash-env \
            --no-color \
            --log-level=error
