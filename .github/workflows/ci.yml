name: CI

on:
  push:
    branches:
      - main
      - experiment/cross-model-pulpo-lift-2026-08-27
      - experiment/cross-model-pulpo-lift-b-2026-08-27
      - diagnostic/copilot-actions-model-policy-2026-08-27
  pull_request:

permissions:
  contents: read
  copilot-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run zero-dependency tests
        run: python -W error -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q pulpo tests
      - name: Check committed whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD

  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install reviewed authority verifier dependency
        run: python -m pip install '.[authority]'
      - name: Run asymmetric authority contract tests
        run: python -W error -m unittest tests.test_authority_crypto -v

  authority-service:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install independent authority proof packages
        run: python -m pip install '.[authority]' './authority-service[test]'
      - name: Run independent authority service proof
        run: PYTHONPATH=authority-service/src:. python -W error -m unittest discover -s authority-service/tests -v
      - name: Compile independent service sources
        run: python -m compileall -q authority-service/src authority-service/tests

  copilot-model-policy-probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/diagnostic/copilot-actions-model-policy-2026-08-27'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned Copilot CLI
        run: npm install -g '@github/copilot@1.0.80'
      - name: Probe auto and documented explicit models
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          TOOLS='bash,create,edit,glob,grep,list_agents,list_bash,read_agent,read_bash,skill,stop_bash,task,view,web_fetch,write_agent'
          for MODEL in auto gpt-5.3-codex claude-haiku-4.5 gemini-3.5-flash; do
            HOME_DIR="${{ runner.temp }}/copilot-${MODEL}"
            WORK_DIR="${{ runner.temp }}/probe-${MODEL}"
            mkdir -p "$HOME_DIR" "$WORK_DIR"
            echo "=== MODEL_PROBE_START ${MODEL} ==="
            (
              cd "$WORK_DIR"
              COPILOT_HOME="$HOME_DIR" copilot -p 'Return exactly READY and nothing else.' \
                --model "$MODEL" \
                --max-ai-credits=30 \
                --excluded-tools="$TOOLS" \
                --disable-builtin-mcps \
                --no-custom-instructions \
                --no-ask-user \
                --no-auto-update \
                --no-bash-env \
                --no-color \
                --log-level=error
            )
            STATUS=$?
            echo "=== MODEL_PROBE_END ${MODEL} status=${STATUS} ==="
          done
          exit 0
