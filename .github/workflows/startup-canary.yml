name: CI startup canary

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prove runner startup
        run: |
          echo "runner-started"
          python3 --version || true
          uname -a
