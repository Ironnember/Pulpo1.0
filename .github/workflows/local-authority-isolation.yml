name: Local Authority Isolation Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  local-authority-process-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build local authority image
        run: docker build -f authority-service/Dockerfile -t pulpo-authority-local:${{ github.sha }} .

      - name: Prove hostile worker cannot enter authority custody
        shell: bash
        run: |
          set -euo pipefail

          root="${RUNNER_TEMP}/pulpo-authority-${GITHUB_RUN_ID}"
          secrets="$root/secrets"
          public="$root/public"
          mkdir -p "$secrets" "$public"
          chmod 700 "$secrets"

          worker_token='worker-only-request-token-v0'
          worker_token_sha="$(printf '%s' "$worker_token" | sha256sum | awk '{print $1}')"

          # Ephemeral acceptance signer. The private bytes exist only in the
          # authority secret mount; the worker receives only the public
          # fingerprint through the fixed runtime configuration.
          python - <<'PY' "$secrets/authority-private-key.hex" "$root/fingerprint"
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from hashlib import sha256
          import pathlib, sys

          key = Ed25519PrivateKey.generate()
          private = key.private_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PrivateFormat.Raw,
              encryption_algorithm=serialization.NoEncryption(),
          )
          public = key.public_key().public_bytes(
              encoding=serialization.Encoding.Raw,
              format=serialization.PublicFormat.Raw,
          )
          private_path = pathlib.Path(sys.argv[1])
          private_path.write_text(private.hex() + "\n", encoding="ascii")
          private_path.chmod(0o600)
          pathlib.Path(sys.argv[2]).write_text(sha256(public).hexdigest(), encoding="ascii")
          PY
          fingerprint="$(cat "$root/fingerprint")"

          cat > "$secrets/credentials.json" <<'JSON'
          {
            "schema": "pulpo.local-authority-credentials.v0",
            "credentials": [
              {
                "credential_id": "credential:hardware-primary",
                "public_key_hex": "00",
                "sign_count": 0,
                "role": "primary",
                "active": true,
                "hardware_attested": true,
                "backup_eligible": false
              }
            ]
          }
          JSON
          chmod 600 "$secrets/credentials.json"

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$secrets/tls.key" \
            -out "$public/tls.crt" \
            -days 1 \
            -subj '/CN=authority.local' \
            -addext 'subjectAltName=DNS:authority.local' >/dev/null 2>&1
          chmod 600 "$secrets/tls.key"
          cp "$public/tls.crt" "$secrets/tls.crt"

          network="pulpo-authority-${GITHUB_RUN_ID}"
          state_volume="pulpo-authority-state-${GITHUB_RUN_ID}"
          evidence_volume="pulpo-authority-evidence-${GITHUB_RUN_ID}"
          authority="pulpo-authority-${GITHUB_RUN_ID}"
          image="pulpo-authority-local:${GITHUB_SHA}"

          docker network create "$network" >/dev/null
          docker volume create "$state_volume" >/dev/null
          docker volume create "$evidence_volume" >/dev/null
          cleanup() {
            docker rm -f "$authority" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            docker volume rm "$state_volume" >/dev/null 2>&1 || true
            docker volume rm "$evidence_volume" >/dev/null 2>&1 || true
            rm -rf "$root"
          }
          trap cleanup EXIT

          docker run -d \
            --name "$authority" \
            --network "$network" \
            --network-alias authority.local \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            -v "$state_volume:/var/lib/pulpo/authority/state:rw" \
            -v "$evidence_volume:/var/lib/pulpo/authority/evidence:rw" \
            -v "$secrets:/run/pulpo-authority:ro" \
            -e PULPO_AUTHORITY_ORIGIN=https://authority.local:8443 \
            -e PULPO_AUTHORITY_RP_ID=authority.local \
            -e PULPO_AUTHORITY_PORT=8443 \
            -e PULPO_AUTHORITY_ID=authority:local-acceptance \
            -e PULPO_AUTHORITY_VERIFIER_ID=verifier:local-ed25519 \
            -e PULPO_AUTHORITY_KEY_ID=key:local-authority-v0 \
            -e PULPO_AUTHORITY_EXPECTED_KEY_FINGERPRINT="$fingerprint" \
            -e PULPO_AUTHORITY_DEPLOYMENT_ID=deployment:local-acceptance-v0 \
            -e PULPO_AUTHORITY_MAX_TTL_SECONDS=300 \
            -e PULPO_AUTHORITY_PRIVATE_KEY_PATH=/run/pulpo-authority/authority-private-key.hex \
            -e PULPO_AUTHORITY_CREDENTIALS_PATH=/run/pulpo-authority/credentials.json \
            -e PULPO_AUTHORITY_STATE_PATH=/var/lib/pulpo/authority/state/authority.sqlite3 \
            -e PULPO_AUTHORITY_EVIDENCE_DIR=/var/lib/pulpo/authority/evidence \
            -e PULPO_AUTHORITY_WORKER_TOKEN_SHA256="$worker_token_sha" \
            -e PULPO_AUTHORITY_TLS_CERT_PATH=/run/pulpo-authority/tls.crt \
            -e PULPO_AUTHORITY_TLS_KEY_PATH=/run/pulpo-authority/tls.key \
            "$image" >/dev/null

          healthy=0
          for _ in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Status}}' "$authority")"
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$authority")"
            if [ "$status" = exited ] || [ "$status" = dead ]; then
              docker logs "$authority" >&2 || true
              exit 1
            fi
            if [ "$health" = healthy ]; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" = 1

          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$authority")" = true
          docker exec "$authority" sh -c 'test "$(id -u)" -ne 0'
          docker exec "$authority" sh -c 'test -f /var/lib/pulpo/authority/state/authority.sqlite3'
          test -z "$(docker port "$authority")"

          # A fresh hostile worker gets only its narrow request token and the
          # public TLS certificate. It gets neither authority storage volume nor
          # signer/WebAuthn secret mount nor Docker control socket.
          docker run --rm \
            --network "$network" \
            -e WORKER_TOKEN="$worker_token" \
            -v "$public:/public:ro" \
            python:3.11-slim \
            python - <<'PY'
          import hashlib, json, os, urllib.error, urllib.request

          assert not os.path.exists('/run/pulpo-authority/authority-private-key.hex')
          assert not os.path.exists('/run/pulpo-authority/credentials.json')
          assert not os.path.exists('/var/lib/pulpo/authority/state/authority.sqlite3')
          assert not os.path.exists('/var/lib/pulpo/authority/evidence')
          assert not os.path.exists('/var/run/docker.sock')

          base = 'https://authority.local:8443'
          context = __import__('ssl').create_default_context(cafile='/public/tls.crt')

          def request(method, path, body=None, token=None):
              data = None if body is None else json.dumps(body, separators=(',', ':')).encode()
              headers = {'Accept': 'application/json', 'Content-Type': 'application/json'}
              if token is not None:
                  headers['Authorization'] = 'Bearer ' + token
              req = urllib.request.Request(base + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, context=context, timeout=5) as response:
                      return response.status, json.loads(response.read())
              except urllib.error.HTTPError as exc:
                  return exc.code, json.loads(exc.read())

          status, health = request('GET', '/health')
          assert status == 200 and health == {'status': 'ok', 'authority_effect': 'none'}

          intent = {
              'principal': 'agent:hostile-worker',
              'action': 'request',
              'resource': 'domain:acceptance.example',
              'cost': 0,
              'session_id': 'session:local-container-proof',
          }
          canonical = json.dumps(intent, sort_keys=True, separators=(',', ':')).encode()
          approval = {
              **intent,
              'intent_hash': hashlib.sha256(canonical).hexdigest(),
              'policy_hash': 'a' * 64,
              'deployment_id': 'deployment:local-acceptance-v0',
              'requested_ttl_ns': 1_000_000_000,
              'schema': 'pulpo.authority-request.v1',
          }

          status, _ = request('POST', '/v1/approval-requests', approval)
          assert status == 401
          status, _ = request('POST', '/v1/approval-requests', approval, 'wrong-token')
          assert status == 401

          token = os.environ['WORKER_TOKEN']
          status, created = request('POST', '/v1/approval-requests', approval, token)
          assert status == 200
          request_id = created['request_id']
          assert created['approval_url'].startswith(base + '/human/approval/')
          status, pending = request('GET', '/v1/approval-requests/' + urllib.parse.quote(request_id, safe=''), token=token)
          assert status == 200 and pending == {'status': 'pending'}

          # Worker possession of request/poll identity does not produce approval.
          status, result = request(
              'POST',
              '/human/approval/' + urllib.parse.quote(request_id, safe='') + '/assertion',
              {'credential_id': 'credential:hardware-primary', 'assertion': '{'},
              token,
          )
          assert status == 403
          status, pending = request('GET', '/v1/approval-requests/' + urllib.parse.quote(request_id, safe=''), token=token)
          assert status == 200 and pending == {'status': 'pending'}

          for path in ('/docs', '/redoc', '/openapi.json', '/v1/sign', '/v1/enroll', '/v1/recover', '/v1/rotate', '/v1/revoke'):
              status, _ = request('GET', path, token=token)
              assert status == 404, (path, status)
          PY

          # Restart the authority process over the same state/evidence volumes.
          docker restart "$authority" >/dev/null
          healthy=0
          for _ in $(seq 1 30); do
            health="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$authority")"
            if [ "$health" = healthy ]; then
              healthy=1
              break
            fi
            sleep 1
          done
          test "$healthy" = 1
