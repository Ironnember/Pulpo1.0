name: Telegram Custody Transport Proof

on:
  push:
    branches:
      - experiment/telegram-custody-transport-v0
  pull_request:
    paths:
      - "pulpo/telegram.py"
      - "custody-service/src/pulpo_custody_service/telegram_transport.py"
      - "custody-service/tests/test_telegram_transport.py"
      - "proofs/telegram-custody-transport-v0.md"
      - ".github/workflows/telegram-custody-transport-proof.yml"

permissions:
  contents: read

jobs:
  telegram-custody-transport-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install custody proof package
        run: python -m pip install './custody-service[test]'
      - name: Prove token destination and provider-response boundaries
        run: PYTHONPATH=custody-service/src:. python -W error -m unittest custody-service/tests/test_telegram_transport.py -v
      - name: Compile custody transport and tests
        run: python -m compileall -q custody-service/src/pulpo_custody_service/telegram_transport.py custody-service/tests/test_telegram_transport.py
      - name: Check committed whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
