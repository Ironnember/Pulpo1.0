name: KMS Probe Container Proof

on:
  pull_request:

permissions:
  contents: read

jobs:
  kms-probe-container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Build exact KMS probe image
        run: docker build -f authority-service/Dockerfile.kms-probe -t pulpo-authority-kms-probe:${SOURCE_SHA} .

      - name: Verify capability-stripped KMS probe container
        shell: bash
        run: |
          set -euo pipefail
          image="pulpo-authority-kms-probe:${SOURCE_SHA}"

          test -n "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(docker inspect -f '{{.Config.User}}' "$image")" = "pulpo"
          test -z "$(docker inspect -f '{{json .Config.ExposedPorts}}' "$image" | sed 's/null//')"
          test "$(docker inspect -f '{{json .Config.Cmd}}' "$image")" = '["python","-m","pulpo_authority_service.kms_probe"]'

          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --entrypoint python \
            "$image" -c "
          import os
          from pathlib import Path
          from pulpo_authority_service.kms_probe import (
              EXPECTED_PUBLIC_FINGERPRINT,
              KEY_VERSION_NAME,
              PROBE_PAYLOAD,
              probe_kms_signer,
          )
          forbidden = {
              'GOOGLE_APPLICATION_CREDENTIALS',
              'PULPO_KERNEL_SECRET_HEX',
              'PULPO_CUSTODY_SECRET_HEX',
              'NAMECOM_SANDBOX_EXECUTOR_TOKEN',
              'NAMECOM_SANDBOX_OBSERVER_TOKEN',
          }
          assert forbidden.isdisjoint(os.environ), sorted(forbidden.intersection(os.environ))
          assert KEY_VERSION_NAME.endswith('/cryptoKeyVersions/1')
          assert EXPECTED_PUBLIC_FINGERPRINT == 'b59288317ee9735a3bfd24595fd6a5d5c97476c1461b945124aded9ffd0ab127'
          assert b'NON_AUTHORITY_TEST_VECTOR' in PROBE_PAYLOAD
          assert callable(probe_kms_signer)
          package = Path('/opt/pulpo/authority-service/src/pulpo_authority_service')
          assert sorted(path.name for path in package.glob('*.py')) == [
              'gcp_kms_transport.py',
              'kms_probe.py',
              'kms_signer.py',
          ]
          "

      - name: Preserve exact built image bytes and manifest
        shell: bash
        run: |
          set -euo pipefail
          image="pulpo-authority-kms-probe:${SOURCE_SHA}"
          mkdir -p kms-probe-artifact
          docker image inspect "$image" > kms-probe-artifact/docker-image-inspect.json
          docker save "$image" | gzip -1 > kms-probe-artifact/pulpo-authority-kms-probe.tar.gz
          sha256sum kms-probe-artifact/pulpo-authority-kms-probe.tar.gz | tee kms-probe-artifact/pulpo-authority-kms-probe.tar.gz.sha256
          printf '%s\n' "$SOURCE_SHA" > kms-probe-artifact/source-head.txt

      - name: Upload exact KMS probe artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulpo-authority-kms-probe-${{ github.event.pull_request.head.sha }}
          path: kms-probe-artifact/
          if-no-files-found: error
          retention-days: 7
