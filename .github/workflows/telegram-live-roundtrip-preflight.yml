name: Telegram Live Roundtrip Preflight

on:
  push:
    branches:
      - experiment/telegram-live-roundtrip-v0
  pull_request:
    paths:
      - "pulpo/telegram.py"
      - "pulpo/telegram_ingress.py"
      - "custody-service/src/pulpo_custody_service/telegram_transport.py"
      - "scripts/telegram_live_roundtrip_v0.py"
      - "tests/test_telegram.py"
      - "tests/test_telegram_ingress.py"
      - "custody-service/tests/test_telegram_transport.py"
      - "custody-service/tests/test_telegram_live_roundtrip.py"
      - "proofs/telegram-live-roundtrip-v0.md"
      - ".github/workflows/telegram-live-roundtrip-preflight.yml"

permissions:
  contents: read

jobs:
  telegram-live-roundtrip-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install custody proof package
        run: python -m pip install './custody-service[test]'
      - name: Re-prove ingress exact-send custody and roundtrip boundaries
        run: >-
          PYTHONPATH=custody-service/src:.
          python -W error -m unittest
          tests.test_telegram_ingress
          tests.test_telegram
          custody-service/tests/test_telegram_transport.py
          custody-service/tests/test_telegram_live_roundtrip.py
          -v
      - name: Compile composed Telegram proof
        run: >-
          PYTHONPATH=custody-service/src:.
          python -m py_compile
          pulpo/telegram.py
          pulpo/telegram_ingress.py
          custody-service/src/pulpo_custody_service/telegram_transport.py
          scripts/telegram_live_roundtrip_v0.py
          tests/test_telegram.py
          tests/test_telegram_ingress.py
          custody-service/tests/test_telegram_transport.py
          custody-service/tests/test_telegram_live_roundtrip.py
      - name: Prove live roundtrip token is hidden-local only
        shell: bash
        run: |
          set -euo pipefail
          if grep -q -- '--token' scripts/telegram_live_roundtrip_v0.py; then
            echo 'live roundtrip unexpectedly exposes a token CLI argument' >&2
            exit 1
          fi
          if grep -q 'PULPO_TELEGRAM_BOT_TOKEN' scripts/telegram_live_roundtrip_v0.py; then
            echo 'live roundtrip unexpectedly reads token from environment state' >&2
            exit 1
          fi
          grep -q 'getpass(' scripts/telegram_live_roundtrip_v0.py
      - name: Check committed whitespace
        run: git diff --check 4b825dc642cb6eb9a060e54bf8d69288fbee4904 HEAD
