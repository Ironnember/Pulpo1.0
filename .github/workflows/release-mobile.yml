name: Build Pulpo Mobile Downloads

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: pulpo-mobile-macos
          - os: windows-latest
            artifact: pulpo-mobile-windows
          - os: ubuntu-latest
            artifact: pulpo-mobile-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and bundler
        run: python -m pip install -e ".[web]" pyinstaller
      - name: Build executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            data_path="mobile_demo/static;mobile_demo/static"
          else
            data_path="mobile_demo/static:mobile_demo/static"
          fi
          python -m PyInstaller --onefile --name "${{ matrix.artifact }}" \
            --add-data "$data_path" mobile_demo/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}${{ runner.os == 'Windows' && '.exe' || '' }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find release-assets -type f -exec chmod +x {} +
          gh release create "${GITHUB_REF_NAME}" release-assets/*/* \
            --generate-notes --title "Pulpo ${GITHUB_REF_NAME}"
