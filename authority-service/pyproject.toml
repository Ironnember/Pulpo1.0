[project]
name = "pulpo-independent-authority"
version = "0.1.0"
description = "Independent WebAuthn authority service for Pulpo"
requires-python = ">=3.11"
dependencies = [
  "cryptography==50.0.1",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "webauthn==3.0.0",
]

[project.optional-dependencies]
test = ["httpx2==2.12.0"]

[tool.setuptools.packages.find]
where = ["src"]
